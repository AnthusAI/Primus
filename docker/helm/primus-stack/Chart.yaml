apiVersion: v2
name: primus-stack
description: Complete Primus data processing stack with PostgreSQL, GraphQL proxy, and HTTP scoring workers
type: application
version: 1.0.0
appVersion: "1.0.0"

maintainers:
  - name: Primus Team

dependencies:
  # PostgreSQL for private data storage (Items, ScoreResults, FeedbackItems)
  - name: postgresql
    version: "~15.5.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
    tags:
      - database

  # GraphQL Proxy - The Adapter between workers and data sources
  - name: graphql-proxy
    version: "1.0.0"
    repository: "file://../charts/graphql-proxy"
    condition: graphql-proxy.enabled
    tags:
      - application

  # Primus workers - HTTP scoring API workers for Envoy Gateway routing
  - name: primus-worker
    version: "1.0.0"
    repository: "file://../primus-worker"
    condition: primus-worker.enabled
    tags:
      - application
